[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-finder"
version = "0.2.0"
description = "ScholarLift — autonomous multi-agent scholarship finder (TetraNoodle AI Hackathon 2026)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.3",
    "pymupdf>=1.25",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.28",
    "google-genai>=1.0",
    "openai>=1.50",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "trafilatura>=1.12",          # local main-content extraction
    "fastapi>=0.115",
    "python-multipart>=0.0.9",    # multipart form uploads
    "uvicorn[standard]>=0.32",
    "anyio>=4.6",
    "jinja2>=3.1.0",
    "json-repair>=0.30",          # robust LLM JSON repair
]

[project.scripts]
scholarship-run = "scholarship_finder.cli:main"
scholarship-preflight = "scholarship_finder.preflight:main"

[project.optional-dependencies]
full = [
    "playwright>=1.49",           # headless browser fetch tier (FULL profile only)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scholarship_finder = ["web/templates/*.html", "web/static/**/*", "samples/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py312"

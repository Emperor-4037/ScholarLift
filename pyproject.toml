[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-finder"
version = "0.1.0"
description = "Autonomous Multi-Agent AI Scholarship Finder — TetraNoodle AI Hackathon 2026"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.3",
    "pymupdf>=1.25",
    "pypdf>=5.0",
    "httpx>=0.28",
    "google-genai>=1.0",
    "openai>=1.50",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",          # local main-content extraction (Tier 2 fetch)
    "fastapi>=0.115",              # SSE transport
    "uvicorn[standard]>=0.32",
    "aiofiles>=24.1",
    "anyio>=4.6",
    "jinja2>=3.1.0",              # HTML templates for FastAPI UI
]

[project.scripts]
scholarship-run = "scholarship_finder.cli:main"
scholarship-preflight = "scholarship_finder.preflight:__main__"

[project.optional-dependencies]
full = [
    "playwright>=1.49",           # Tier-3 headless browser (FULL profile only)
]
ocr = [
    "pillow>=10.0.0",            # Image processing for OCR (optional, pymupdf has built-in rendering)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py312"
